# Price Tag Zero: every listed app. This file is the source of truth.
# README.md and REPLACES.md are generated from it by scripts/build.py,
# and scripts/check.py validates it. See CONTRIBUTING.md for the rules.
#
# Fields
#   id            lowercase-kebab-case, unique
#   name          display name
#   url           homepage (the README links here)
#   repo          source repository
#   category      a category id from data/categories.yaml
#   description   one line, 90 characters or fewer, ends with a period
#   replaces      1-3 well-known paid products it replaces
#   platforms     any of: windows, macos, linux, self-hosted
#   portable      true if it runs without installing
#   license       SPDX license id or expression, OSI-approved
#   maintainer    true only for apps made by this list's maintainer (optional)
#   last_release  date of the latest release checked (YYYY-MM-DD)
#   last_activity date of the latest commit or release checked (YYYY-MM-DD)
#   checked       date this entry was last verified (YYYY-MM-DD)
#   evidence      proof for the rules; kept for review, not shown in the README
#     license_url   the LICENSE file
#     license_note  optional note about the license (for example, "GitHub repo is a mirror")
#     release_url   the latest downloadable release
#     release_note  optional note about the release (version, date, where to download)
#     github_license  optional: what GitHub's license detection reports, when it differs
#                   from `license` (for example NOASSERTION); the weekly check compares against it
#     money         the page checked for anything sold, and what it says
#     gui           how we know it has a real GUI

